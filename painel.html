<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Gestor - Ads</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border-card: rgba(51, 65, 85, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --accent-gold: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% -20%, #1e1b4b, var(--bg-dark) 60%);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .refresh-btn {
            background-color: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            background-color: #2563eb;
        }

        .filter-select {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            min-width: 180px;
        }

        .filter-select:focus {
            border-color: var(--accent-blue);
        }

        /* SCORECARDS */
        .scorecards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
        }

        .card.cost::before { background: var(--accent-red); }
        .card.conversions::before { background: var(--accent-blue); }
        .card.cpa::before { background: var(--accent-purple); }
        .card.profit::before { background: var(--accent-green); }
        .card.roi::before { background: var(--accent-gold); }

        .card-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            transition: color 0.3s;
        }
        
        .value-green { color: #34d399 !important; }
        .value-red { color: #f87171 !important; }

        /* TABLE */
        .table-container {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 14px 12px;
            font-size: 0.80rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-card);
            font-weight: 600;
            white-space: nowrap;
        }

        td {
            padding: 14px 12px;
            font-size: 0.90rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
            white-space: nowrap;
        }

        tbody tr:hover {
            background-color: rgba(255,255,255,0.02);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
        }
        
        .commission-input {
            background-color: rgba(15, 23, 42, 0.8);
            color: #f8fafc;
            border: 1px solid #3b82f6;
            border-radius: 4px;
            padding: 6px;
            width: 80px;
            outline: none;
            font-weight: 600;
            text-align: right;
        }

        .commission-input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .commission-input.real {
            border-color: #10b981;
        }

        .commission-input.real:focus {
            border-color: #34d399;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        /* LOADER */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; gap: 20px; }
            .controls { width: 100%; flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel Consolidado</h1>
            <div class="controls">
                <select id="view-mode" class="filter-select" onchange="renderDashboard()" style="border-color: var(--accent-gold);">
                    <option value="DAILY">Visão: Dia-a-Dia</option>
                    <option value="CONSOLIDATED" selected>Visão: Consolidada (Acumulado)</option>
                </select>
                <select id="date-filter" class="filter-select" onchange="renderDashboard()">
                    <option value="TODAY">Hoje</option>
                    <option value="YESTERDAY">Ontem</option>
                    <option value="LAST_7_DAYS">Últimos 7 Dias</option>
                    <option value="THIS_MONTH" selected>Este Mês</option>
                    <option value="ALL">Todo o Período</option>
                </select>
                <select id="campaign-filter" class="filter-select" onchange="renderDashboard()">
                    <option value="ALL">Todas as Campanhas</option>
                </select>
                <button class="refresh-btn" onclick="fetchData()">
                    <div class="loader" id="loader"></div>
                    <span id="btn-text">Atualizar</span>
                </button>
            </div>
        </header>

        <div class="scorecards">
            <div class="card cost">
                <div class="card-title">Custo Total</div>
                <div class="card-value" id="total-cost">R$ 0,00</div>
            </div>
            <div class="card conversions">
                <div class="card-title">Conversões Totais</div>
                <div class="card-value" id="total-conv">0</div>
            </div>
            <div class="card cpa">
                <div class="card-title">CPA Médio</div>
                <div class="card-value" id="avg-cpa">R$ 0,00</div>
            </div>
            <div class="card profit">
                <div class="card-title">Saldo Líquido Real</div>
                <div class="card-value" id="total-profit">R$ 0,00</div>
            </div>
            <div class="card roi">
                <div class="card-title">ROI Real Global</div>
                <div class="card-value" id="total-roi">0%</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Conta</th>
                        <th>Campanha</th>
                        <th>Custo</th>
                        <th>Conv.</th>
                        <th>CPA Real</th>
                        <th>Comissão Base</th>
                        <th style="color: #94a3b8;">Rec. Esperada</th>
                        <th style="color: #10b981;">Receita REAL</th>
                        <th>Saldo</th>
                        <th>ROI</th>
                        <th>Orçamento</th>
                        <th>Imp.</th>
                        <th>% Topo</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="15" style="text-align:center; color: var(--text-muted);">Carregando dados...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SHEET_ID = '1uPLYRDRydkUeoNodP8GOZM_xvAw0LBXJaYTsWxY0tEo';
        const SHEET_NAME = 'GestaoAfiliado';
        const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        let globalData = []; 

        // Utilities
        function formatMoney(value) {
            const num = parseFloat(value) || 0;
            return 'R$ ' + num.toFixed(2).replace('.', ',');
        }

        function formatNumber(value) {
            const num = parseFloat(value) || 0;
            return num.toLocaleString('pt-BR');
        }

        function formatPercent(value) {
            if (value === null || value === undefined || value === '' || value === '-') return '-';
            if (typeof value === 'string' && value.includes('<')) return value;
            const num = parseFloat(value);
            if (isNaN(num)) return value;
            return (num * 100).toFixed(1) + '%';
        }

        function getIsoDateFromRow(dateRaw) {
            if (!dateRaw) return '';
            let str = String(dateRaw);
            if (str.startsWith('Date(')) {
                const m = str.match(/Date\((\d+),\s*(\d+),\s*(\d+)/);
                if (m) {
                    const y = m[1];
                    const mo = String(parseInt(m[2], 10) + 1).padStart(2, '0');
                    const d = m[3].padStart(2, '0');
                    return `${y}-${mo}-${d}`;
                }
            } else if (str.includes('-')) {
                if(str.split('-').length === 3) return str;
            } else if (str.includes('/')) {
                const p = str.split('/');
                if(p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
            }
            return str;
        }

        function formatDateBR(isoStr) {
            if(!isoStr || !isoStr.includes('-')) return isoStr;
            const p = isoStr.split('-');
            return `${p[2]}/${p[1]}/${p[0]}`;
        }

        // LocalStorage Logic
        function saveCommBase(campaign, value) {
            localStorage.setItem('commBase_' + campaign, value);
            renderDashboard(); 
        }

        function getCommBase(campaign) {
            return parseFloat(localStorage.getItem('commBase_' + campaign)) || 0;
        }

        function saveRealRev(date, campaign, value) {
            localStorage.setItem('realRev_' + date + '_' + campaign, value);
            renderDashboard();
        }

        function getRealRev(date, campaign) {
            const val = localStorage.getItem('realRev_' + date + '_' + campaign);
            return val !== null && val !== '' ? parseFloat(val) : null;
        }

        // Date Logic
        const todayD = new Date();
        const getOffsetIso = (offset) => {
            const d = new Date(todayD);
            d.setDate(d.getDate() + offset);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        };
        const TODAY_ISO = getOffsetIso(0);
        const YESTERDAY_ISO = getOffsetIso(-1);
        const SEVEN_DAYS_AGO_ISO = getOffsetIso(-7);
        const THIS_MONTH_PREFIX = TODAY_ISO.substring(0, 7);

        async function fetchData() {
            const loader = document.getElementById('loader');
            const btnText = document.getElementById('btn-text');
            
            loader.style.display = 'block';
            btnText.style.display = 'none';

            try {
                const response = await fetch(URL);
                const text = await response.text();
                // Extract JSON
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonString);
                
                const rows = data.table.rows;
                
                let startIdx = 0;
                if(rows.length > 0 && rows[0].c[0] && rows[0].c[0].v === 'Data') {
                    startIdx = 1;
                }

                globalData = [];
                const campaignsSet = new Set();
                const latestDataMap = new Map();

                for(let i = startIdx; i < rows.length; i++) {
                    const row = rows[i].c;
                    const dateRaw = row[0] ? (row[0].f || row[0].v) : '';
                    const isoDate = getIsoDateFromRow(dateRaw) || '-';
                    
                    const account = row[1] ? row[1].v : '-';
                    const campaign = row[3] ? row[3].v : '-';
                    
                    const orcamento = row[4] ? parseFloat(row[4].v) || 0 : 0;
                    const targetCpa = row[5] ? parseFloat(row[5].v) || 0 : 0;
                    const impressions = row[6] ? parseFloat(row[6].v) || 0 : 0;
                    const clicks = row[7] ? parseFloat(row[7].v) || 0 : 0;
                    const cost = row[8] ? parseFloat(row[8].v) || 0 : 0;
                    const conv = row[9] ? parseFloat(row[9].v) || 0 : 0;
                    const cpa = row[10] ? parseFloat(row[10].v) || 0 : 0;
                    const cpc = row[11] ? parseFloat(row[11].v) || 0 : 0;
                    const percTopo = row[12] ? row[12].v : 0;
                    const percAbsTopo = row[13] ? row[13].v : 0;

                    const key = `${isoDate}|${account}|${campaign}`;
                    latestDataMap.set(key, { 
                        isoDate, account, campaign, orcamento, targetCpa, impressions, 
                        clicks, cost, conv, cpa, cpc, percTopo, percAbsTopo 
                    });
                    
                    if(campaign !== '-') campaignsSet.add(campaign);
                }

                globalData = Array.from(latestDataMap.values());

                // Sort descending by date
                globalData.sort((a, b) => b.isoDate.localeCompare(a.isoDate));

                // Populate Dropdown
                const filterSelect = document.getElementById('campaign-filter');
                filterSelect.innerHTML = '<option value="ALL">Todas as Campanhas</option>';
                const sortedCampaigns = Array.from(campaignsSet).sort();
                
                sortedCampaigns.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c;
                    option.textContent = c;
                    filterSelect.appendChild(option);
                });

                renderDashboard();

            } catch (err) {
                console.error(err);
                document.getElementById('table-body').innerHTML = '<tr><td colspan="15" style="text-align:center; color: #ef4444;">Erro ao carregar dados. Verifique a planilha.</td></tr>';
            } finally {
                loader.style.display = 'none';
                btnText.style.display = 'inline';
            }
        }

        function renderDashboard() {
            const viewMode = document.getElementById('view-mode').value;
            const campaignFilter = document.getElementById('campaign-filter').value;
            const dateFilter = document.getElementById('date-filter').value;
            
            let totalCost = 0;
            let totalConv = 0;
            let totalRealRevenue = 0;
            let tableHtml = '';

            // Apply Filters First
            const filteredData = globalData.filter(item => {
                if (campaignFilter !== 'ALL' && item.campaign !== campaignFilter) return false;
                if (dateFilter === 'TODAY' && item.isoDate !== TODAY_ISO) return false;
                if (dateFilter === 'YESTERDAY' && item.isoDate !== YESTERDAY_ISO) return false;
                if (dateFilter === 'LAST_7_DAYS' && item.isoDate < SEVEN_DAYS_AGO_ISO) return false;
                if (dateFilter === 'THIS_MONTH' && !item.isoDate.startsWith(THIS_MONTH_PREFIX)) return false;
                return true;
            });

            // Prepare Data to Render
            let dataToRender = [];

            if (viewMode === 'CONSOLIDATED') {
                const groupMap = new Map();
                filteredData.forEach(item => {
                    if (!groupMap.has(item.campaign)) {
                        groupMap.set(item.campaign, {
                            isoDate: 'Acumulado',
                            account: item.account,
                            campaign: item.campaign,
                            orcamento: item.orcamento,
                            targetCpa: item.targetCpa,
                            impressions: 0,
                            clicks: 0,
                            cost: 0,
                            conv: 0,
                            cpa: 0,
                            cpc: 0,
                            percTopo: '-',
                            percAbsTopo: '-',
                            sumRealRev: 0
                        });
                    }
                    const g = groupMap.get(item.campaign);
                    g.impressions += item.impressions;
                    g.clicks += item.clicks;
                    g.cost += item.cost;
                    g.conv += item.conv;
                    if (g.account !== item.account) {
                        g.account = 'Múltiplas';
                    }

                    // Calculation of sum of real revenue
                    const commBase = getCommBase(item.campaign);
                    const expected = item.conv * commBase;
                    const rr = getRealRev(item.isoDate, item.campaign);
                    g.sumRealRev += (rr !== null) ? rr : expected; // fallback to expected
                });

                // Calculate CPA and CPC for groups
                dataToRender = Array.from(groupMap.values()).map(g => {
                    g.cpa = g.conv > 0 ? g.cost / g.conv : 0;
                    g.cpc = g.clicks > 0 ? g.cost / g.clicks : 0;
                    return g;
                });
            } else {
                dataToRender = filteredData;
            }

            // Render Table
            if(dataToRender.length === 0) {
                tableHtml = '<tr><td colspan="15" style="text-align:center; color: #94a3b8;">Nenhum dado encontrado para os filtros selecionados.</td></tr>';
            } else {
                dataToRender.forEach(item => {
                    const commBase = getCommBase(item.campaign);
                    const expectedRev = item.conv * commBase;
                    let finalRealRev = 0;
                    let rr = null;

                    if (viewMode === 'DAILY') {
                        rr = getRealRev(item.isoDate, item.campaign);
                        finalRealRev = (rr !== null) ? rr : expectedRev;
                    } else {
                        finalRealRev = item.sumRealRev;
                    }

                    const profit = finalRealRev - item.cost;
                    const roi = item.cost > 0 ? (profit / item.cost) * 100 : 0;

                    totalCost += item.cost;
                    totalConv += item.conv;
                    totalRealRevenue += finalRealRev;

                    // Clean string for JS injection
                    const cleanCampaign = item.campaign.replace(/'/g, "\\'");

                    tableHtml += `
                        <tr>
                            <td><span style="color: ${item.isoDate === 'Acumulado' ? '#8b5cf6' : 'inherit'}; font-weight: ${item.isoDate === 'Acumulado' ? 'bold' : 'normal'}">${item.isoDate === 'Acumulado' ? 'Acumulado' : formatDateBR(item.isoDate)}</span></td>
                            <td><span class="badge">${item.account}</span></td>
                            <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis;" title="${item.campaign}">${item.campaign}</td>
                            <td style="color: #fca5a5; font-weight:600;">${formatMoney(item.cost)}</td>
                            <td style="color: #6ee7b7; font-weight:600;">${formatNumber(item.conv)}</td>
                            <td>${formatMoney(item.cpa)}</td>
                            <td>
                                <input type="number" class="commission-input" value="${commBase > 0 ? commBase : ''}" 
                                       onchange="saveCommBase('${cleanCampaign}', this.value)" 
                                       placeholder="Base R$">
                            </td>
                            <td style="color: #94a3b8;">${formatMoney(expectedRev)}</td>
                            <td>
                                ${viewMode === 'DAILY' ? `
                                <input type="number" class="commission-input real" 
                                       value="${rr !== null ? rr : ''}" 
                                       onchange="saveRealRev('${item.isoDate}', '${cleanCampaign}', this.value)" 
                                       placeholder="${formatMoney(expectedRev).replace('R$ ','')}">
                                ` : `
                                <span style="color: #10b981; font-weight:600;">${formatMoney(finalRealRev)}</span>
                                `}
                            </td>
                            <td class="${profit > 0 ? 'value-green' : (profit < 0 ? 'value-red' : '')} font-weight:600;">${formatMoney(profit)}</td>
                            <td class="${roi > 0 ? 'value-green' : (roi < 0 ? 'value-red' : '')} font-weight:600;">${roi.toFixed(1).replace('.',',')}%</td>
                            <td style="color: #94a3b8;">${formatMoney(item.orcamento)}</td>
                            <td style="color: #94a3b8;">${formatNumber(item.impressions)}</td>
                            <td style="color: #94a3b8;">${item.percTopo === '-' ? '-' : formatPercent(item.percTopo)}</td>
                        </tr>
                    `;
                });
            }

            // Global Calculations
            const avgCpa = totalConv > 0 ? (totalCost / totalConv) : 0;
            const globalProfit = totalRealRevenue - totalCost;
            let globalRoi = 0;
            if (totalCost > 0) {
                globalRoi = (globalProfit / totalCost) * 100;
            }

            document.getElementById('total-cost').innerText = formatMoney(totalCost);
            document.getElementById('total-conv').innerText = formatNumber(totalConv);
            document.getElementById('avg-cpa').innerText = formatMoney(avgCpa);
            
            const profitEl = document.getElementById('total-profit');
            const roiEl = document.getElementById('total-roi');
            
            profitEl.innerText = formatMoney(globalProfit);
            roiEl.innerText = globalRoi.toFixed(1).replace('.', ',') + '%';

            // Coloring logic global
            if (totalRealRevenue > 0 || totalCost > 0) {
                profitEl.className = 'card-value ' + (globalProfit > 0 ? 'value-green' : (globalProfit < 0 ? 'value-red' : ''));
                roiEl.className = 'card-value ' + (globalRoi > 0 ? 'value-green' : (globalRoi < 0 ? 'value-red' : ''));
            } else {
                profitEl.className = 'card-value';
                roiEl.className = 'card-value';
            }

            document.getElementById('table-body').innerHTML = tableHtml;
        }

        // Fetch initial data
        fetchData();
    </script>
</body>
</html>
